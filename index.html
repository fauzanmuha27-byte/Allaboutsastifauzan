<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akad Invitation</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background-color:#000;
  background-image:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url("https://drive.google.com/uc?export=view&id=1bRq1lbbqDQXtJghjxcUO0eM16ThZv7eM");
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
}

/* ================= CONTENT ================= */
.container{
  text-align:center;
  animation: fadeUp 1.6s ease forwards;
  opacity:0;
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.dear{
  font-size:14px;
  letter-spacing:1px;
  margin-bottom:8px;
}

.guest-box{
  display:inline-block;
  padding:10px 26px;
  border:1px solid rgba(255,255,255,0.7);
  border-radius:30px;
  font-size:15px;
  margin-bottom:22px;
  animation: fadeBox 1.8s ease forwards;
  opacity:0;
}

@keyframes fadeBox{
  from{opacity:0; transform:scale(0.95);}
  to{opacity:1; transform:scale(1);}
}

h1{
  font-family:'Playfair Display', serif;
  font-weight:600;
  letter-spacing:2px;
  font-size:28px;
  margin:0 0 10px;
}

.date{
  font-size:14px;
  letter-spacing:2px;
  margin-bottom:26px;
}

/* ===== typing text ===== */
.typing{
  font-family:'Playfair Display', serif;
  font-size:16px;
  letter-spacing:1px;
  height:22px;
  margin-bottom:34px;
  opacity:0;
  animation: typingFade 16s infinite;
}

@keyframes typingFade{
  0%{opacity:0;}
  10%{opacity:1;}
  70%{opacity:1;}
  90%{opacity:0;}
  100%{opacity:0;}
}

button{
  padding:14px 40px;
  border:none;
  border-radius:40px;
  font-size:15px;
  background:linear-gradient(135deg,#e6c97a,#b1976b);
  color:#fff;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
}

.note{
  font-size:11px;
  margin-top:16px;
  opacity:.8;
}

/* ================= LOVE EFFECT ================= */
.love{
  position:absolute;
  bottom:-40px;
  color:#f2d27a;
  font-size:26px;          /* 🔥 DIBESARKAN */
  opacity:0.9;
  animation: floatUp 9s linear infinite;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(1);
    opacity:0;
  }
  10%{opacity:1;}
  90%{opacity:1;}
  100%{
    transform:translateY(-120vh) scale(1.4);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="dear">Dear</div>
  <div class="guest-box" id="guestName">Our Beloved Guest</div>

  <h1>SASTI & FAUZAN</h1>
  <div class="date">17 · 01 · 26</div>

  <div class="typing">Akad Intimate Invitation</div>

  <button onclick="openInvitation()">Open Invitation</button>
  <div class="note">Please turn on the music inside the invitation</div>
</div>

<!-- MUSIC -->
<iframe id="music" allow="autoplay" style="display:none"></iframe>

<script>
/* ====== NAMA TAMU dari URL ====== */
const params = new URLSearchParams(window.location.search);
const guest = params.get("to");
if(guest){
  document.getElementById("guestName").innerText = guest;
}

/* ====== OPEN INVITATION ====== */
function openInvitation(){
  document.getElementById("music").src =
  "https://archive.org/embed/lagu-nikah-juicy-luicy-saxophone-cover-by-priyanka-sedayu-serenata-channel?autoplay=1";

  setTimeout(()=>{
    window.location.href =
    "https://sastiforfauzan.my.canva.site/akadinvitation";
  },300);
}

/* ====== LOVE GENERATOR ====== */
for(let i=0;i<18;i++){
  let love=document.createElement("div");
  love.className="love";
  love.innerHTML="❤";
  love.style.left=Math.random()*100+"vw";
  love.style.animationDelay=Math.random()*6+"s";
  document.body.appendChild(love);
}
</script>

</body>
</html>
